global:
  extraArgs:
    - "-config.expand-env=true"

loki:
  auth_enabled: false
  schemaConfig:
    configs:
      - from: 2024-01-01
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: s3
    bucketNames:
      chunks: chunks
      ruler: ruler
      admin: admin
    # Rendered into the common and ruler storage configs. Without it the ruler
    # has no endpoint or credentials and fails to list rules every minute.
    s3:
      endpoint: 192.168.1.252:9000
      region: us-east-1
      accessKeyId: ${MINIO_ACCESS_KEY}
      secretAccessKey: ${MINIO_SECRET_KEY}
      s3ForcePathStyle: true
      insecure: true
  storage_config:
    tsdb_shipper:
      active_index_directory: var/loki/index
      cache_location: var/loki/index_cache
      cache_ttl: 24h
    aws:
      s3: http://192.168.1.252:9000
      # Must match s3_region in Garage's garage.toml
      region: us-east-1
      s3forcepathstyle: true
      insecure: true
      access_key_id: ${MINIO_ACCESS_KEY}
      secret_access_key: ${MINIO_SECRET_KEY}
  podSecurityContext:
    fsGroup: 10001
    runAsGroup: 10001
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault

test:
  enabled: false

lokiCanary:
  enabled: false

# In SimpleScalable mode the ruler always runs inside the backend pods. This
# flag only controls whether the chart renders its storage config (the
# `ruler` bucket); no separate ruler pods are created.
ruler:
  enabled: true

write:
  persistence:
    volumeClaimsEnabled: true
    size: 10Gi
    storageClass: ceph-rbd
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 1Gi
  extraEnvFrom:
    - secretRef:
        name: loki-minio-credentials

read:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  extraEnvFrom:
    - secretRef:
        name: loki-minio-credentials
  extraArgs:
    - "-config.expand-env=true"

backend:
  persistence:
    volumeClaimsEnabled: true
    size: 10Gi
    storageClass: ceph-rbd
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  extraEnvFrom:
    - secretRef:
        name: loki-minio-credentials

memcachedExporter:
  enabled: false

resultsCache:
  enabled: false

chunksCache:
  enabled: false

gateway:
  enabled: false

ingress:
  enabled: true
  ingressClassName: "traefik"
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "web"
  hosts:
      - loki.home.jasongodson.com