                      key: MINIO_ACCESS_KEY
                - name: RCLONE_CONFIG_BACKUP_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: k8s-app-backups-minio-credentials
                      key: MINIO_SECRET_KEY
