# Copy this file to secrets.yaml and replace every placeholder locally.
# secrets.yaml is ignored by Git and must never be committed.

wifi_ssid: "replace-with-wifi-ssid"
wifi_password: "replace-with-wifi-password"
panel_heat_monitor_api_key: "replace-with-base64-api-encryption-key"
panel_heat_monitor_ota_password: "replace-with-ota-password"
panel_heat_monitor_fallback_password: "replace-with-fallback-password"

# One-wire addresses discovered by ESPHome; fill in the actual probe IDs.
panel_heat_monitor_probe_1_address: "replace-with-probe-1-address"
