- id: "1785980294814"
  alias: Pool Heater - temperature control with 20/5 cycle
  description: >-
    Maintains 78 F normally or 85 F in Ready Mode, using a 20-minute-on,
    5-minute-off cycle from 8:00 AM until 10:00 PM.
  initial_state: true
  triggers:
    - trigger: time_pattern
      minutes: "/1"
    - trigger: homeassistant
      event: start
    - trigger: state
      entity_id:
        - input_boolean.pool_ready_mode
        - sensor.pool_water_temperature_last_valid
  conditions: []
  actions:
    - variables:
        pool_temperature_entity: >-
          sensor.pool_water_temperature_last_valid
        target_temperature_c: >-
          {{ 29.444 if is_state('input_boolean.pool_ready_mode', 'on') else 25.556 }}
        pool_temperature_c: >-
          {{ states(pool_temperature_entity) | float(999) }}
        temperature_is_fresh: >-
          {% set last_valid_update =
            state_attr(pool_temperature_entity, 'last_valid_update') | float(0) %}
          {{
            states(pool_temperature_entity) not in ['unknown', 'unavailable']
            and (as_timestamp(now()) - last_valid_update) < 1500
          }}
        should_be_on: >-
          {% set minute_of_day = now().hour * 60 + now().minute %}
          {% set minutes_since_8am = minute_of_day - 480 %}
          {{
            0 <= minutes_since_8am < 840
            and (minutes_since_8am % 25) < 20
            and (temperature_is_fresh | bool)
            and (pool_temperature_c | float) < (target_temperature_c | float)
          }}
    - choose:
        - conditions:
            - condition: template
              value_template: >-
                {{
                  (should_be_on | bool)
                  and not is_state(
                    'switch.tp_link_smart_plug_e471_heater_pump',
                    'on'
                  )
                }}
          sequence:
            - action: switch.turn_on
              target:
                entity_id: switch.tp_link_smart_plug_e471_heater_pump
        - conditions:
            - condition: template
              value_template: >-
                {{
                  not (should_be_on | bool)
                  and not is_state(
                    'switch.tp_link_smart_plug_e471_heater_pump',
                    'off'
                  )
                }}
          sequence:
            - action: switch.turn_off
              target:
                entity_id: switch.tp_link_smart_plug_e471_heater_pump
  mode: single

- id: pool_pump_daily_schedule
  alias: Pool Pump - Daily schedule
  description: Runs from 8:00 AM to 4:00 PM and 5:00 PM to midnight
  triggers:
    - trigger: time_pattern
      minutes: "/1"
    - trigger: homeassistant
      event: start
  conditions: []
  actions:
    - variables:
        should_be_on: >-
          {% set minute_of_day = now().hour * 60 + now().minute %}
          {{
            480 <= minute_of_day < 960
            or 1020 <= minute_of_day < 1440
          }}
    - choose:
        - conditions:
            - condition: template
              value_template: >-
                {{
                  (should_be_on | bool)
                  and not is_state(
                    'switch.tp_link_smart_plug_e471_pool_pump',
                    'on'
                  )
                }}
          sequence:
            - action: switch.turn_on
              target:
                entity_id: switch.tp_link_smart_plug_e471_pool_pump
        - conditions:
            - condition: template
              value_template: >-
                {{
                  not (should_be_on | bool)
                  and not is_state(
                    'switch.tp_link_smart_plug_e471_pool_pump',
                    'off'
                  )
                }}
          sequence:
            - action: switch.turn_off
              target:
                entity_id: switch.tp_link_smart_plug_e471_pool_pump
  mode: single

- id: ecobee_fan_temperature_balance_start
  alias: Ecobee - Start fan for floor temperature imbalance
  description: >-
    Runs the furnace fan after the upstairs and downstairs temperatures differ
    by more than 5 C for five minutes.
  initial_state: true
  triggers:
    - trigger: state
      entity_id: binary_sensor.ecobee_floor_temperature_imbalance
      to: "on"
    - trigger: time_pattern
      minutes: "/1"
    - trigger: homeassistant
      event: start
  conditions:
    - condition: state
      entity_id: binary_sensor.ecobee_floor_temperature_imbalance
      state: "on"
    - condition: state
      entity_id: input_boolean.ecobee_fan_temperature_balancing
      state: "off"
    - condition: template
      value_template: >-
        {{ state_attr('climate.main_floor', 'fan_mode') != 'on' }}
  actions:
    - action: climate.set_fan_mode
      target:
        entity_id: climate.main_floor
      data:
        fan_mode: "on"
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.ecobee_fan_temperature_balancing
  mode: single

- id: ecobee_fan_temperature_balance_stop
  alias: Ecobee - Stop fan after floor temperatures balance
  description: >-
    Returns the furnace fan to automatic operation after the temperature
    difference remains below 4 C, or if either temperature sensor is lost.
  initial_state: true
  triggers:
    - trigger: state
      entity_id: binary_sensor.ecobee_floor_temperatures_balanced
      to: "on"
    - trigger: state
      entity_id: binary_sensor.ecobee_floor_temperature_sensor_problem
      to: "on"
    - trigger: time_pattern
      minutes: "/1"
    - trigger: homeassistant
      event: start
  conditions:
    - condition: state
      entity_id: input_boolean.ecobee_fan_temperature_balancing
      state: "on"
    - condition: or
      conditions:
        - condition: state
          entity_id: binary_sensor.ecobee_floor_temperatures_balanced
          state: "on"
        - condition: state
          entity_id: binary_sensor.ecobee_floor_temperature_sensor_problem
          state: "on"
  actions:
    - action: climate.set_fan_mode
      target:
        entity_id: climate.main_floor
      data:
        fan_mode: "auto"
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.ecobee_fan_temperature_balancing
  mode: single
