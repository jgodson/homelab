- id: panel_heat_monitor_alerts
  alias: Panel Heat Monitor - heat and sensor warnings
  description: >-
    Alerts Home Assistant and the configured phone when either panel probe exceeds
    60 C, a probe fails, or the monitor is offline for a minute. Heat warnings
    clear below 58 C in the device firmware.
  initial_state: true
  triggers:
    - trigger: state
      entity_id:
        - binary_sensor.panel_heat_monitor_panel_probe_1_overheat
        - binary_sensor.panel_heat_monitor_panel_probe_2_overheat
        - binary_sensor.panel_heat_monitor_panel_probe_fault
      to: "on"
    - trigger: state
      entity_id: binary_sensor.panel_heat_monitor_panel_probe_fault
      to:
        - unavailable
        - unknown
      for: "00:01:00"
    - trigger: homeassistant
      event: start
      id: startup
  conditions: []
  actions:
    - if:
        - condition: template
          value_template: "{{ trigger is defined and trigger.id == 'startup' }}"
      then:
        - delay: "00:01:00"
    - condition: template
      value_template: >-
        {{
          is_state('binary_sensor.panel_heat_monitor_panel_probe_1_overheat', 'on')
          or is_state('binary_sensor.panel_heat_monitor_panel_probe_2_overheat', 'on')
          or not is_state('binary_sensor.panel_heat_monitor_panel_probe_fault', 'off')
        }}
    - variables:
        warning_title: >-
          {% if
            is_state('binary_sensor.panel_heat_monitor_panel_probe_1_overheat', 'on')
            or is_state('binary_sensor.panel_heat_monitor_panel_probe_2_overheat', 'on')
          %}
            Electrical panel temperature warning
          {% else %}
            Electrical panel monitor fault
          {% endif %}
        warning_message: >-
          {% set probe_1 = states('sensor.panel_heat_monitor_panel_probe_1_temperature') %}
          {% set probe_2 = states('sensor.panel_heat_monitor_panel_probe_2_temperature') %}
          {% if not has_value('binary_sensor.panel_heat_monitor_panel_probe_fault') %}
            The panel heat monitor is offline; temperatures cannot be checked.
          {% elif is_state('binary_sensor.panel_heat_monitor_panel_probe_fault', 'on') %}
            A panel temperature probe has failed; temperature monitoring is incomplete.
          {% else %}
            A panel probe exceeded 60 C. The heat warning clears below 58 C.
          {% endif %}
          Probe 1: {{ probe_1 | float | round(1) if is_number(probe_1) else probe_1 }}
          {{ state_attr('sensor.panel_heat_monitor_panel_probe_1_temperature', 'unit_of_measurement') or '' }}.
          Probe 2: {{ probe_2 | float | round(1) if is_number(probe_2) else probe_2 }}
          {{ state_attr('sensor.panel_heat_monitor_panel_probe_2_temperature', 'unit_of_measurement') or '' }}.
    - action: persistent_notification.create
      data:
        title: "{{ warning_title | trim }}"
        message: "{{ warning_message | trim }}"
        notification_id: panel_heat_monitor_warning
    - action: !secret panel_heat_monitor_notify_service
      data:
        title: "{{ warning_title | trim }}"
        message: "{{ warning_message | trim }}"
        data:
          tag: panel_heat_monitor_warning
  mode: queued
  max: 5

- id: pool_pump_daily_schedule
  alias: Pool Pump - Daily schedule
  description: Runs from 8:00 AM to 4:00 PM and 5:00 PM to midnight
  triggers:
    - trigger: time_pattern
      minutes: "/1"
    - trigger: homeassistant
      event: start
  conditions: []
  actions:
    - variables:
        should_be_on: >-
          {% set minute_of_day = now().hour * 60 + now().minute %}
          {{
            480 <= minute_of_day < 960
            or 1020 <= minute_of_day < 1440
          }}
    - choose:
        - conditions:
            - condition: template
              value_template: >-
                {{
                  (should_be_on | bool)
                  and not is_state(
                    'switch.tp_link_smart_plug_e471_pool_pump',
                    'on'
                  )
                }}
          sequence:
            - action: switch.turn_on
              target:
                entity_id: switch.tp_link_smart_plug_e471_pool_pump
        - conditions:
            - condition: template
              value_template: >-
                {{
                  not (should_be_on | bool)
                  and not is_state(
                    'switch.tp_link_smart_plug_e471_pool_pump',
                    'off'
                  )
                }}
          sequence:
            - action: switch.turn_off
              target:
                entity_id: switch.tp_link_smart_plug_e471_pool_pump
  mode: single

- id: ecobee_fan_temperature_balance_start
  alias: Ecobee - Start fan for floor temperature imbalance
  description: >-
    Runs the furnace fan after the upstairs and downstairs temperatures differ
    by more than 5 C for five minutes.
  initial_state: true
  triggers:
    - trigger: state
      entity_id: binary_sensor.ecobee_floor_temperature_imbalance
      to: "on"
    - trigger: time_pattern
      minutes: "/1"
    - trigger: homeassistant
      event: start
  conditions:
    - condition: state
      entity_id: binary_sensor.ecobee_floor_temperature_imbalance
      state: "on"
    - condition: state
      entity_id: input_boolean.ecobee_fan_temperature_balancing
      state: "off"
    - condition: template
      value_template: >-
        {{ state_attr('climate.main_floor', 'fan_mode') != 'on' }}
  actions:
    - action: climate.set_fan_mode
      target:
        entity_id: climate.main_floor
      data:
        fan_mode: "on"
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.ecobee_fan_temperature_balancing
  mode: single

- id: ecobee_fan_temperature_balance_stop
  alias: Ecobee - Stop fan after floor temperatures balance
  description: >-
    Returns the furnace fan to automatic operation after the temperature
    difference remains below 4 C, or if either temperature sensor is lost.
  initial_state: true
  triggers:
    - trigger: state
      entity_id: binary_sensor.ecobee_floor_temperatures_balanced
      to: "on"
    - trigger: state
      entity_id: binary_sensor.ecobee_floor_temperature_sensor_problem
      to: "on"
    - trigger: time_pattern
      minutes: "/1"
    - trigger: homeassistant
      event: start
  conditions:
    - condition: state
      entity_id: input_boolean.ecobee_fan_temperature_balancing
      state: "on"
    - condition: or
      conditions:
        - condition: state
          entity_id: binary_sensor.ecobee_floor_temperatures_balanced
          state: "on"
        - condition: state
          entity_id: binary_sensor.ecobee_floor_temperature_sensor_problem
          state: "on"
  actions:
    - action: climate.set_fan_mode
      target:
        entity_id: climate.main_floor
      data:
        fan_mode: "auto"
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.ecobee_fan_temperature_balancing
  mode: single
