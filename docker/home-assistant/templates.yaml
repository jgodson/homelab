- triggers:
    - trigger: state
      entity_id: sensor.backyard_pool_temperature_sensor_pool_water_temperature
      not_to:
        - unknown
        - unavailable
  conditions:
    # A failed 0 C probe reading becomes -1.1 C after calibration. Keep the
    # previous state unless the new value is plausible pool water temperature.
    - condition: template
      value_template: >-
        {% set pool_temperature_c = trigger.to_state.state | float(none) %}
        {{
          pool_temperature_c is not none
          and 4.4 < pool_temperature_c < 43.4
        }}
  sensor:
    - name: Pool Water Temperature Last Valid
      unique_id: pool_water_temperature_last_valid
      state: "{{ trigger.to_state.state }}"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      attributes:
        last_valid_update: >-
          {{ as_timestamp(trigger.to_state.last_reported) }}

- binary_sensor:
    - name: Ecobee Floor Temperature Imbalance
      unique_id: ecobee_floor_temperature_imbalance
      icon: mdi:home-thermometer-outline
      availability: >-
        {{
          is_number(states('sensor.upstairs_temperature'))
          and is_number(states('sensor.downstairs_temperature'))
        }}
      state: >-
        {{
          (
            states('sensor.upstairs_temperature') | float
            - states('sensor.downstairs_temperature') | float
          ) | abs > 5
        }}
      delay_on:
        minutes: 5

    - name: Ecobee Floor Temperatures Balanced
      unique_id: ecobee_floor_temperatures_balanced
      icon: mdi:home-thermometer
      availability: >-
        {{
          is_number(states('sensor.upstairs_temperature'))
          and is_number(states('sensor.downstairs_temperature'))
        }}
      state: >-
        {{
          (
            states('sensor.upstairs_temperature') | float
            - states('sensor.downstairs_temperature') | float
          ) | abs < 4
        }}
      delay_on:
        minutes: 10

    - name: Ecobee Floor Temperature Sensor Problem
      unique_id: ecobee_floor_temperature_sensor_problem
      icon: mdi:thermometer-alert
      state: >-
        {{
          not is_number(states('sensor.upstairs_temperature'))
          or not is_number(states('sensor.downstairs_temperature'))
        }}
      delay_on:
        minutes: 15
