services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    privileged: true
    environment:
      - TZ=America/Edmonton
    volumes:
      - ./docker/ha:/config
      - /run/dbus:/run/dbus:ro
    network_mode: host
    logging: 
      driver: loki
      options:
        loki-url: "https://loki.home.jasongodson.com/loki/api/v1/push"
        loki-retries: 2
        loki-max-backoff: 800ms
        loki-timeout: 1s
        keep-file: "true"
        mode: "non-blocking"
        max-size: "10m"
        max-file: "3"

  esphome:
    image: ghcr.io/esphome/esphome:2026.7
    container_name: esphome
    restart: unless-stopped
    env_file:
      - ./esphome-dashboard.env
    environment:
      - TZ=America/Edmonton
    volumes:
      - ./docker/esphome:/config
      - /etc/localtime:/etc/localtime:ro
    network_mode: host
