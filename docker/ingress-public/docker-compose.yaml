x-logging: &default-logging
  logging:
    driver: loki
    options:
      loki-url: "https://loki.home.jasongodson.com/loki/api/v1/push"
      loki-retries: 4
      loki-max-backoff: 800ms
      loki-timeout: 1s
      keep-file: "true"
      mode: "non-blocking"
      max-size: "10m"
      max-file: "3"

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    <<: *default-logging
    container_name: cloudflared
    command: tunnel run
    restart: unless-stopped
    env_file:
      - ./cloudflared/.env
    environment:
      - TUNNEL_METRICS=0.0.0.0:2000
      - NO_AUTOUPDATE=true
      # QUIC connections from this host repeatedly time out ("no recent network activity")
      - TUNNEL_TRANSPORT_PROTOCOL=http2
    volumes:
      - ./cloudflared:/etc/cloudflared
    ports:
      - "2000:2000"
    networks:
      - proxy-network

  caddy:
    build:
      context: .
      dockerfile: Caddy-Dockerfile
    <<: *default-logging
    container_name: caddy
    restart: unless-stopped
    ports:
      - "2019:2019"
    env_file: 
      - ./caddy/.env
    environment:
      - DOMAIN=jasongodson.com
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - ./caddy/site:/srv
      - ./caddy/data:/data
      - ./caddy/config:/config
      - ./caddy/logs:/var/log/caddy
    depends_on:
      - cloudflared
      - crowdsec
    networks:
      - proxy-network

  # Privacy-friendly web analytics. Only the tracker script and collect endpoint
  # are exposed publicly (via Caddy); the dashboard is LAN-only on :8081.
  # Secrets live in ./umami.env (not in git), see README.
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    <<: *default-logging
    container_name: umami
    restart: unless-stopped
    env_file:
      - ./umami.env
    environment:
      # Non-default names so ad blockers' generic "umami" rules don't match
      - TRACKER_SCRIPT_NAME=u.js
      - COLLECT_API_ENDPOINT=/api/u
      - DISABLE_TELEMETRY=1
    ports:
      - "8081:3000"
    depends_on:
      umami-db:
        condition: service_healthy
    networks:
      - proxy-network

  umami-db:
    image: postgres:17-alpine
    <<: *default-logging
    container_name: umami-db
    restart: unless-stopped
    env_file:
      - ./umami.env
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - proxy-network

  crowdsec:
    image: crowdsecurity/crowdsec:latest
    <<: *default-logging
    container_name: crowdsec
    restart: unless-stopped
    environment:
      - COLLECTIONS=crowdsecurity/caddy
      - GID=1000
      - TZ=America/Edmonton
    ports:
      - "6060:6060"
    volumes:
      - ./crowdsec/config:/etc/crowdsec
      - ./crowdsec/data:/var/lib/crowdsec/data
      - ./crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml
      - ./caddy/logs:/var/log/caddy:ro
    networks:
      - proxy-network

volumes:
  umami-db-data:

networks:
  proxy-network:
    driver: bridge