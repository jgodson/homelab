<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Not Found | Jason Godson</title>
    <style>
        :root {
            --paper: #faf7f0;
            --card: #fffef9;
            --ink: #18181b;
            --muted: #52525b;
            --orange: #eb5e28;
            --orange-hover: #f26a36;
            --font-marker: 'Permanent Marker', 'Marker Felt', 'Chalkboard SE', 'Comic Sans MS', sans-serif;
            --font-mono: 'Space Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            background-color: var(--paper);
            color: var(--ink);
            font-family: var(--font-mono);
            line-height: 1.6;
        }

        /* Taped-in note card */
        .card {
            position: relative;
            width: 100%;
            max-width: 520px;
            padding: 2.5rem 2rem 2rem;
            background-color: var(--card);
            border-left: 4px solid var(--orange);
            border-radius: 2px;
            box-shadow: 2px 3px 8px rgba(0, 0, 0, 0.08), 0 1px 2px rgba(0, 0, 0, 0.06);
            text-align: center;
            transform: rotate(-0.6deg);
        }

        .card::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            width: 72px;
            height: 20px;
            margin-left: -36px;
            background: rgba(235, 222, 195, 0.85);
            border: 1px dashed rgba(160, 145, 120, 0.5);
            transform: rotate(-2deg);
        }

        .sign {
            display: block;
            width: 160px;
            height: auto;
            margin: 0 auto 1.25rem;
        }

        h1 {
            margin: 0;
            font-family: var(--font-marker);
            font-weight: 400;
            font-size: 1.6rem;
            line-height: 1.2;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .underline {
            display: block;
            width: 75px;
            height: 5px;
            margin: 6px auto 0;
            background-color: var(--orange);
            border-radius: 3px;
            transform: rotate(-0.6deg);
        }

        p {
            margin: 1.25rem 0 1.75rem;
            color: var(--muted);
            font-size: 0.95rem;
        }

        .actions {
            display: flex;
            gap: 0.85rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            display: inline-block;
            padding: 7px 16px;
            background-color: var(--card);
            color: var(--ink);
            border: 2px solid var(--ink);
            border-radius: 2px;
            box-shadow: 2px 2px 0 var(--ink);
            font-family: var(--font-mono);
            font-weight: 700;
            font-size: 0.85rem;
            text-decoration: none;
            text-transform: uppercase;
            transition: transform 0.1s ease, box-shadow 0.1s ease, background-color 0.1s ease;
        }

        .btn:hover {
            transform: translate(-1px, -1px);
            box-shadow: 3px 3px 0 var(--ink);
        }

        .btn.primary {
            background-color: var(--orange);
            border-width: 2.5px;
            box-shadow: 3px 3px 0 var(--ink);
        }

        .btn.primary:hover {
            background-color: var(--orange-hover);
            box-shadow: 4px 4px 0 var(--ink);
        }
    </style>
</head>
<body>
    <main class="card">
        <svg class="sign" viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <g stroke="#18181b" stroke-width="3" stroke-linejoin="round">
                <rect x="93" y="10" width="14" height="136" fill="#e9c9a0"/>
                <path d="M30 20H162L182 42L162 64H30Z" fill="#fffef9" transform="rotate(-3 106 42)"/>
                <path d="M172 80H44L24 100L44 120H172Z" fill="#eb5e28" transform="rotate(2 98 100)"/>
            </g>
            <g fill="#18181b" text-anchor="middle">
                <text x="104" y="55" font-family="'Permanent Marker', 'Marker Felt', 'Chalkboard SE', sans-serif" font-size="32" transform="rotate(-3 106 42)">404</text>
                <text x="106" y="106" font-family="'Space Mono', ui-monospace, Menlo, monospace" font-weight="700" font-size="14" letter-spacing="1" transform="rotate(2 98 100)">TRAIL ENDS</text>
            </g>
        </svg>
        <h1>Lost in the forest</h1>
        <span class="underline"></span>
        <p>The page you're looking for doesn't exist, or it wandered off into the woods.</p>
        <div class="actions">
            <a href="https://jasongodson.com" class="btn primary">Back to basecamp</a>
            <a href="https://jasongodson.com/blog/" class="btn">Read the notes</a>
            <a href="https://play.jasongodson.com" class="btn">Play games</a>
        </div>
    </main>
</body>
</html>
