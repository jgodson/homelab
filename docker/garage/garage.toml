metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "lmdb"
# Single node, same redundancy as the MinIO single drive it replaced.
# The offsite copy is the rclone-sync job to Google Drive.
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"
rpc_secret_file = "/run/secrets/rpc_secret"

[s3_api]
# Matches the region clients already send (OpenTofu backend, barman, rclone)
s3_region = "us-east-1"
api_bind_addr = "[::]:3900"

[admin]
api_bind_addr = "[::]:3903"
admin_token_file = "/run/secrets/admin_token"
metrics_token_file = "/run/secrets/metrics_token"
